[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "autosar-hld-assistant"
version = "0.1.0"
description = "Secure, local AUTOSAR HLD document analysis assistant"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "sqlalchemy>=2.0,<3",
  "alembic>=1.13,<2",
  "httpx>=0.27,<1",
  "pypdf>=6,<7",
  "python-multipart>=0.0.9,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-cov>=5,<6",
  "ruff>=0.6,<1",
  "mypy>=1.11,<2",
]
vector = [
  "chromadb>=0.5,<1",
  "sentence-transformers>=3,<4",
]
ui = [
  "streamlit>=1.38,<2",
]
ocr = [
  "pymupdf>=1.24,<2",
  "pytesseract>=0.3.10,<1",
  "pillow>=10,<12",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"scripts/*.py" = ["E501", "F401", "I001"]
"ui/web.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
